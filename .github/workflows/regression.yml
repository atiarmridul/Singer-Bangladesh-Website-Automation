name: Scheduled Regression

on:
  schedule:
    # Runs every day at 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      target_env:
        description: "Environment profile (dev/staging/prod)"
        required: false
        default: "prod"

jobs:
  regression:
    runs-on: ubuntu-latest

    env:
      TEST_ENV: ${{ github.event.inputs.target_env || 'prod' }}
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Run regression suite
        run: npm run test:regression

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-playwright-report-${{ github.run_id }}
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-allure-results-${{ github.run_id }}
          path: allure-results
          if-no-files-found: ignore
